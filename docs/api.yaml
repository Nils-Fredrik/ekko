    get:
      operationId: getAction
      summary: Hent ett tiltak
      description: ''
      x-required-ability: read
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Action'
                required:
                  - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
  /brands/{brand}/facts:
    get:
      operationId: listFacts
      summary: Hent merkevarens fakta
      description: ''
      x-required-ability: read
      parameters:
        - $ref: '#/components/parameters/brand'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BrandFact'
                  current_page:
                    type: integer
                  last_page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
                  next_page_url:
                    type:
                      - string
                      - 'null'
                  prev_page_url:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - current_page
                  - last_page
                  - per_page
                  - total
                  - next_page_url
                  - prev_page_url
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
    post:
      operationId: createFact
      summary: Opprett faktum
      description: Krever manage_brands. Samme duplikat- og antallsgrense som web.
      x-required-ability: write
      parameters:
        - $ref: '#/components/parameters/brand'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 300
                is_active:
                  type: boolean
                  default: true
              required:
                - text
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BrandFact'
                required:
                  - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
    patch:
      operationId: updateFact
      summary: Endre faktum
      description: Krever manage_brands. id i body må tilhøre merkevaren. Endring ugyldiggjør tidligere vurderinger.
      x-required-ability: write
      parameters:
        - $ref: '#/components/parameters/brand'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  minimum: 1
                text:
                  type: string
                  maxLength: 300
                is_active:
                  type: boolean
                  default: true
              required:
                - id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BrandFact'
                required:
                  - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
    delete:
      operationId: deleteFact
      summary: Slett faktum
      description: Krever manage_brands. id sendes i body og må tilhøre merkevaren.
      x-required-ability: write
      parameters:
        - $ref: '#/components/parameters/brand'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  minimum: 1
              required:
                - id
      responses:
        '204':
          description: Slettet eller tilbakekalt.
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
