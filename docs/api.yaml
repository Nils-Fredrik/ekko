        '429': *id005
  /usage:
    get:
      operationId: getUsage
      summary: Hent månedsforbruk
      x-required-ability: read
      parameters:
      - $ref: '#/components/parameters/month'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                    - $ref: '#/components/schemas/Usage'
                    - type: 'null'
                required:
                - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
  /brands/{brand}/actions:
    get:
      operationId: listActions
      summary: Hent tiltak med evidens
      description: type=own betyr tiltak uten type. Fremmede markeds-ID-er gir 404.
      x-required-ability: read
      parameters:
        - $ref: '#/components/parameters/brand'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - new
              - planned
              - in_progress
              - done
              - declined
              - expired
        - name: type
          in: query
          schema:
            type: string
            enum:
              - source_gap
              - owned_content
              - new_competitor
              - crawler_access
              - fact_correction
              - own
        - $ref: '#/components/parameters/market'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Action'
                  current_page:
                    type: integer
                  last_page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
                  next_page_url:
                    type:
                      - string
                      - 'null'
                  prev_page_url:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - current_page
                  - last_page
                  - per_page
                  - total
                  - next_page_url
                  - prev_page_url
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
    post:
      operationId: createAction
      summary: Opprett eget tiltak
      description: Krever manage_prompts. Marked, tema og prompts må tilhøre merkevaren. Starter i planned.
      x-required-ability: write
      parameters:
        - $ref: '#/components/parameters/brand'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: [string, 'null']
                  maxLength: 5000
                steps:
                  type: array
                  maxItems: 25
                  items:
                    type: string
                    maxLength: 1000
                type:
                  type:
                    - string
                    - 'null'
                  enum:
                    - source_gap
                    - owned_content
                    - new_competitor
                    - crawler_access
                    - fact_correction
                    - null
                market_id:
                  type:
                    - integer
                    - 'null'
                topic_id:
                  type:
                    - integer
                    - 'null'
                prompt_ids:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: integer
                    minimum: 1
              required:
                - title
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Action'
                required:
                  - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
    patch:
      operationId: updateAction
      summary: Endre tiltaksstatus
      description: >-
        Krever manage_prompts. id sendes i body. Lovlige overganger følger tiltaksflyten; samme status endrer
        ingen datoer. new og expired kan ikke settes som ny status av brukeren.
      x-required-ability: write
      parameters:
        - $ref: '#/components/parameters/brand'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum:
                    - new
                    - planned
                    - in_progress
                    - done
                    - declined
                    - expired
              required:
                - id
                - status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Action'
                required:
                  - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
