openapi: 3.1.0
info:
  title: Ekko REST API
  version: 1.0.0
  description: 'Tenantbundet REST-API. Opprett personlig Sanctum-token i Jetstream. Send Authorization:
    Bearer <token>, Accept: application/json og Content-Type: application/json ved skriving. Tokenbinding
    endres ikke med nettleserens tenantvalg; ubundne eldre tokens må erstattes. Brukerens nåværende rolle
    kontrolleres på hvert kall. Nettlesersesjon alene gir ikke tilgang. Read og write er uavhengige. Alle
    ruter deler 60 kall/minutt/token og 120 kall/minutt/bruker over alle brukerens tokens. Tokens utløper etter 365 dager. Datoer er inklusive lokale dager i tenantens tidssone. Metrikker
    inkluderer utvalgsstørrelse n og low_sample (n < 10); rater er brøker 0–1 og value er null ved n=0.
    Interne lagringsadresser og rå leverandørpayload eksponeres ikke.'
servers:
- url: /api/v1
security:
- personalToken: []
paths:
  /brands:
    get:
      operationId: listBrands
      summary: List merkevarer
      x-required-ability: read
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandCollection'
        '401': &id001
          description: Manglende, utløpt eller tilbakekalt token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id002
          description: Tenantbinding, medlemskap, rolle, ability, e-post eller tofaktor gir ikke tilgang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id003
          description: Ressursen finnes ikke innen valgt tenant og merkevare.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id004
          description: Valideringsfeil eller pakkegrense.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id005
          description: 60 forespørsler per minutt per token eller 120 per minutt per bruker er overskredet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Sekunder til nytt forsøk.
              schema: &id010
                type: integer
  /brands/{brand}/prompts:
    get:
      operationId: listPrompts
      summary: Hent prompts
      x-required-ability: read
      parameters:
      - $ref: '#/components/parameters/brand'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptCollection'
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
    post:
      operationId: createPrompt
      summary: Opprett prompt
      x-required-ability: write
      parameters:
      - $ref: '#/components/parameters/brand'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Prompt'
                required:
                - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
      description: Krever redigeringsrettighet i tillegg til tokenets write. PATCH og DELETE sender id
        i JSON-body. Marked kan ikke flyttes med PATCH. Bruk is_active=false for å bevare historikk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrompt'
    patch:
      operationId: updatePrompt
      summary: Oppdater prompt
      x-required-ability: write
      parameters:
      - $ref: '#/components/parameters/brand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Prompt'
                required:
                - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
      description: Krever redigeringsrettighet i tillegg til tokenets write. PATCH og DELETE sender id
        i JSON-body. Marked kan ikke flyttes med PATCH. Bruk is_active=false for å bevare historikk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrompt'
    delete:
      operationId: deletePrompt
      summary: Slett prompt og tilknyttet historikk
      x-required-ability: write
      parameters:
      - $ref: '#/components/parameters/brand'
      responses:
        '204':
          description: Slettet, tom body.
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
      description: Krever redigeringsrettighet i tillegg til tokenets write. PATCH og DELETE sender id
        i JSON-body. Marked kan ikke flyttes med PATCH. Bruk is_active=false for å bevare historikk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: &id006
                  type: integer
                  minimum: 1
              required:
              - id
  /brands/{brand}/competitors:
