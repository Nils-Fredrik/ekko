                  - current_page
                  - last_page
                  - per_page
                  - total
                  - next_page_url
                  - prev_page_url
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
  /reports/{report}:
    get:
      operationId: getReport
      summary: Hent én lagret rapport
      description: ''
      x-required-ability: read
      parameters:
        - name: report
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Report'
                required:
                  - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
  /reports/{report}/links:
    post:
      operationId: createReportLink
      summary: Opprett delbar rapportlenke
      description: >-
        Krever manage_reports. Hemmeligheten returneres én gang i URL-fragmentet. Lenken gir offentlig
        lesetilgang til rapporten; svaret har Cache-Control: private, no-store. Operasjonen logges uten
        hemmeligheten.
      x-required-ability: write
      parameters:
        - name: report
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  default: 90
              required: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReportLink'
                required:
                  - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
    delete:
      operationId: revokeReportLink
      summary: Trekk tilbake rapportlenke
      description: Krever manage_reports. id i body må tilhøre rapporten. Gjentatt tilbakekalling er idempotent.
      x-required-ability: write
      parameters:
        - name: report
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  minimum: 1
              required:
                - id
      responses:
        '204':
          description: Slettet eller tilbakekalt.
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
  /pitches:
    get:
      operationId: listPitches
      summary: Hent partnerens pitch-prosjekter
      description: >-
        Krever partnerrådgiver eller plattformadmin i tokenets bundne tenant. Viser bare pitch-prosjekter under
        denne partneren.
      x-required-ability: write
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pitch'
                  current_page:
                    type: integer
                  last_page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
                  next_page_url:
                    type:
                      - string
                      - 'null'
                  prev_page_url:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - current_page
                  - last_page
                  - per_page
                  - total
                  - next_page_url
                  - prev_page_url
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
    post:
      operationId: createPitch
      summary: Opprett pitch for et domene
      description: >-
        Krever partnerrådgiver eller plattformadmin. Partneren er tokenets tenant; partner_team_id og tenant_id
        er forbudt. Maks tre aktive prosjekter, sju dagers levetid. Oppretter merkevare, domene og marked;
        prompts og motorer konfigureres separat før kjøring. Ingen modellkall eller nettverkshenting. Tokenets
        tenantbinding endres ikke. Gjentatte POST-kall oppretter nye prosjekter.
      x-required-ability: write
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                domain:
                  type: string
                  maxLength: 255
                country:
                  type: string
                  pattern: ^[a-zA-Z]{2}$
                language:
                  type: string
                  maxLength: 35
                  pattern: ^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]{2,8})*$
              required:
                - name
                - domain
                - country
                - language
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Pitch'
                required:
                  - data
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
