                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Claim'
                  current_page:
                    type: integer
                  last_page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
                  next_page_url:
                    type:
                      - string
                      - 'null'
                  prev_page_url:
                    type:
                      - string
                      - 'null'
                required:
                  - data
                  - current_page
                  - last_page
                  - per_page
                  - total
                  - next_page_url
                  - prev_page_url
        '401': *id001
        '403': *id002
        '404': *id003
        '422': *id004
        '429': *id005
  /reports:
    get:
      operationId: listReports
      summary: Hent lagrede rapporter
      description: ''
      x-required-ability: read
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
