# Tests and code checks on every pull request and every push to main (docs/spec.md 17.2).
# T10 extends this workflow with building the image and deploying to Cloud Run.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ekko_testing
          # Not UTC on purpose: TZ sets the server's default time zone, and the app must store
          # timestamps in UTC whatever it is (docs/spec.md 6). The session-time-zone test from #14
          # checks that the connection runs in UTC.
          TZ: Europe/Oslo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The postgres service user is a superuser, so the migrations can create the ekko_app role,
    # and TenantRls switches to it in every request and job: row-level security is really tested.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: ekko_testing
      DB_TEST_DATABASE: ekko_testing

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, bcmath, mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Find the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build frontend (the tests need the Vite manifest)
        run: npm run build

      - name: Pint and Larastan
        run: composer lint

      - name: ESLint and Prettier
        run: npm run lint

      - name: Pest, including the tenant isolation suite
        run: composer test

  image:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create local-only context fixtures
        run: bash tests/deploy/test-docker-context.sh prepare
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          load: true
          tags: ekko-context-check:ci
      - name: Verify runtime image excludes local state
        run: bash tests/deploy/test-docker-context.sh verify
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: jobs
          push: false
      - name: Verify failed smoke test keeps traffic unchanged
        run: bash tests/deploy/test-deploy.sh
