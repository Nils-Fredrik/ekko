# Tests and code checks on every pull request and every push to main (docs/spec.md 17.2).
# T10 extends this workflow with building the image and deploying to Cloud Run.
name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    # Never cancel a running main deployment halfway through migration/promotion.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: test
        runs-on: ubuntu-latest
        timeout-minutes: 40

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: ekko_testing
                    # Not UTC on purpose: TZ sets the server's default time zone, and the app must store
                    # timestamps in UTC whatever it is (docs/spec.md 6). The session-time-zone test from #14
                    # checks that the connection runs in UTC.
                    TZ: Europe/Oslo
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        # The postgres service user is a superuser, so the migrations can create the ekko_app role,
        # and TenantRls switches to it in every request and job: row-level security is really tested.
        env:
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_USERNAME: postgres
            DB_PASSWORD: postgres
            DB_DATABASE: ekko_testing
            DB_TEST_DATABASE: ekko_testing

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, pgsql, intl, bcmath, mbstring
                  coverage: none
                  tools: composer:v2

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '24'
                  cache: npm

            - name: Find the Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-php8.4-

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Install Node dependencies
              run: npm ci --no-audit --no-fund

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate --ansi

            - name: Build frontend (the tests need the Vite manifest)
              run: npm run build

            - name: Pint and Larastan
              run: composer lint

            - name: ESLint and Prettier
              run: npm run lint

            - name: Install Chromium for PDF reports
              run: |
                  scripts/ci-install-chromium.sh
                  echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

            - name: Pest, including the tenant isolation suite
              run: composer test

            - name: Agent review security contracts
              run: node --test tests/agent-review/*.test.mjs

            - name: Merge queue security contracts
              run: node --test tests/merge-queue/*.test.mjs

            - name: Performance measurement contract
              run: python3 -m unittest discover -s tests/performance -v

            - name: Chart selection contracts
              run: node --test tests/charts/*.test.mjs

            - name: UI coverage and bundle budget contracts
              run: npm run test:ui:contracts

            - name: JavaScript and chart size budgets
              run: npm run test:budget

            - name: Browser login and dashboard (isolated test database)
              run: npm run test:browser

            - name: Visual regression and accessibility (pinned Linux Chromium)
              run: npm run test:ui

            - name: Show committed baseline changes
              if: always()
              env:
                  UI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: node scripts/ui-quality/compare-baselines.mjs

            - name: Preserve UI reports and image differences
              id: ui-report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ui-quality-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      playwright-report/ui-quality/
                      test-results/ui-quality/
                      ui-quality-results/
                  retention-days: 14
                  if-no-files-found: warn

            - name: Link UI reports in the run summary
              if: always() && steps.ui-report.outputs.artifact-url != ''
              env:
                  UI_REPORT_URL: ${{ steps.ui-report.outputs.artifact-url }}
              run: printf '\n[Download UI screenshots, accessibility findings and baseline differences](%s)\n' "$UI_REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

    image:
        name: container build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            artifact-id: ${{ steps.images.outputs.artifact-id }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - name: Create local-only context fixtures
              run: bash tests/deploy/test-docker-context.sh prepare
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  target: web
                  push: false
                  load: true
                  tags: ekko-context-check:ci
            - name: Verify runtime image excludes local state
              run: bash tests/deploy/test-docker-context.sh verify
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  target: jobs
                  push: false
                  load: true
                  tags: ekko-jobs-check:ci
            - name: Verify jobs image excludes local state
              env:
                  IMAGE: ekko-jobs-check:ci
              run: bash tests/deploy/test-docker-context.sh verify
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci --no-audit --no-fund
            - name: Verify failed smoke test keeps traffic unchanged
              run: bash tests/deploy/test-deploy.sh
            - name: Verify registry digest selection
              run: python3 -m unittest discover -s tests/deploy -v
            - name: Verify artifact download retry and fail-closed behavior
              run: node --test tests/deploy/artifact-download.test.mjs
            - name: Save verified images
              run: |
                  mkdir -p "$RUNNER_TEMP/verified-images"
                  docker save ekko-context-check:ci ekko-jobs-check:ci | gzip -1 > "$RUNNER_TEMP/verified-images/images.tar.gz"
                  cd "$RUNNER_TEMP/verified-images"
                  sha256sum images.tar.gz > images.sha256
            - name: Preserve verified images for this run
              id: images
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: verified-images-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/verified-images/
                  retention-days: 1
                  compression-level: 0
                  if-no-files-found: error
            - name: Download archive to verify transfer before deployment
              uses: ./.github/actions/download-verified-images
              with:
                  artifact-id: ${{ steps.images.outputs.artifact-id }}
                  path: ${{ runner.temp }}/restored-images
            - name: Verify restored image identities and runtime contents
              run: |
                  expected_web=$(docker image inspect ekko-context-check:ci --format '{{.Id}}')
                  expected_jobs=$(docker image inspect ekko-jobs-check:ci --format '{{.Id}}')
                  docker image rm ekko-context-check:ci ekko-jobs-check:ci
                  (cd "$RUNNER_TEMP/restored-images" && sha256sum --check images.sha256)
                  docker load --input "$RUNNER_TEMP/restored-images/images.tar.gz"
                  [[ "$(docker image inspect ekko-context-check:ci --format '{{.Id}}')" == "$expected_web" ]]
                  [[ "$(docker image inspect ekko-jobs-check:ci --format '{{.Id}}')" == "$expected_jobs" ]]
                  bash tests/deploy/test-docker-context.sh verify
                  IMAGE=ekko-jobs-check:ci bash tests/deploy/test-docker-context.sh verify

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EKKO_DEPLOY_ENABLED == 'true'
        needs: [test, image]
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            contents: read
            id-token: write
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        env:
            PROJECT_ID: ekko-514612
            REGION: europe-west1
            WEB_TAG: europe-west1-docker.pkg.dev/ekko-514612/ekko/web:${{ github.sha }}
            JOB_TAG: europe-west1-docker.pkg.dev/ekko-514612/ekko/jobs:${{ github.sha }}
            REVISION_SUFFIX: r${{ github.run_id }}-${{ github.run_attempt }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - id: auth
              uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
              with:
                  workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ekko-ci@ekko-514612.iam.gserviceaccount.com
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci --no-audit --no-fund
            - run: scripts/ci-install-chromium.sh
            - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
            - run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
            - name: Download this run's verified images
              uses: ./.github/actions/download-verified-images
              with:
                  artifact-id: ${{ needs.image.outputs.artifact-id }}
                  path: ${{ runner.temp }}/verified-images
            - name: Publish verified images without rebuilding
              run: |
                  cd "$RUNNER_TEMP/verified-images"
                  sha256sum --check images.sha256
                  docker load --input images.tar.gz
                  docker tag ekko-context-check:ci "$WEB_TAG"
                  docker tag ekko-jobs-check:ci "$JOB_TAG"
                  docker push "$WEB_TAG"
                  docker push "$JOB_TAG"
                  web_image=$(docker image inspect "$WEB_TAG" --format '{{json .RepoDigests}}' | python3 "$GITHUB_WORKSPACE/scripts/image-digest.py" "${WEB_TAG%:*}")
                  job_image=$(docker image inspect "$JOB_TAG" --format '{{json .RepoDigests}}' | python3 "$GITHUB_WORKSPACE/scripts/image-digest.py" "${JOB_TAG%:*}")
                  [[ "$web_image" == "${WEB_TAG%:*}@sha256:"* && "$job_image" == "${JOB_TAG%:*}@sha256:"* ]]
                  [[ "${web_image##*@}" =~ ^sha256:[a-f0-9]{64}$ && "${job_image##*@}" =~ ^sha256:[a-f0-9]{64}$ ]]
                  echo "WEB_IMAGE=$web_image" >> "$GITHUB_ENV"
                  echo "JOB_IMAGE=$job_image" >> "$GITHUB_ENV"
            - name: Deploy candidate and promote after smoke test
              env:
                  SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
                  SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
                  SMOKE_REST_TOKEN: ${{ secrets.SMOKE_REST_TOKEN }}
                  SMOKE_TENANT_ID: ${{ vars.SMOKE_TENANT_ID }}
                  SMOKE_BRAND_ID: ${{ vars.SMOKE_BRAND_ID }}
                  SMOKE_MCP_CLIENT_ID: ${{ vars.SMOKE_MCP_CLIENT_ID }}
              run: scripts/deploy.sh
