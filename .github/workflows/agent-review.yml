name: Agent review request

on:
    pull_request_target:
        types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
        branches: [main]

permissions: {}

concurrency:
    group: agent-review-request-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.title && !github.event.changes.base && '-metadata' || '' }}
    cancel-in-progress: true

jobs:
    request:
        if: github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && github.event.pull_request.draft == false && (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base)
        environment: agent-review
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '24'
            - id: app-token
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ vars.AGENT_REVIEW_APP_ID }}
                  private-key: ${{ secrets.AGENT_REVIEW_PRIVATE_KEY }}
                  permission-statuses: write
            - name: Invalidate earlier approval
              run: node scripts/agent-review/github.mjs request
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
