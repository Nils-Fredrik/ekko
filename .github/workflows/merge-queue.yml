name: Merge queue

on:
    push:
        branches: [main]
    workflow_run:
        workflows: [CI, Agent review execution]
        types: [completed]
    schedule:
        - cron: '*/5 * * * *'
    workflow_dispatch:

permissions:
    contents: read

# Ignored completion events must not replace a pending reconciliation.
# Eligible events still share one queue; cron recovers dropped/delayed events.
concurrency:
    group: ${{ (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'ekko-merge-queue' || format('ekko-merge-queue-ignored-{0}', github.run_id) }}
    cancel-in-progress: false

jobs:
    reconcile:
        if: >-
            github.ref == 'refs/heads/main' && vars.EKKO_MERGE_QUEUE_ENABLED == 'true' &&
            (github.event_name != 'workflow_run' ||
             (github.event.workflow_run.conclusion == 'success' &&
              github.event.workflow_run.head_repository.full_name == github.repository))
        environment: merge-queue
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # Only trusted main code is checked out. PR code is never executed here.
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: refs/heads/main
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '24'
            - id: app-token
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ vars.MERGE_QUEUE_APP_ID }}
                  private-key: ${{ secrets.MERGE_QUEUE_PRIVATE_KEY }}
                  permission-administration: read
                  permission-actions: read
                  permission-contents: write
                  permission-pull-requests: write
                  permission-checks: read
                  permission-statuses: read
            - name: Verify queue App is allowed to trigger review
              run: node scripts/merge-queue/config.mjs verify-token
              env:
                  MERGE_QUEUE_BOT_SLUG: ${{ vars.MERGE_QUEUE_BOT_SLUG }}
                  MERGE_QUEUE_TOKEN_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
            - name: Reconcile one pull request
              run: node scripts/merge-queue/queue.mjs
              env:
                  MERGE_QUEUE_TOKEN: ${{ steps.app-token.outputs.token }}
                  MERGE_QUEUE_ALLOWED_AUTHORS: ${{ vars.MERGE_QUEUE_ALLOWED_AUTHORS }}
