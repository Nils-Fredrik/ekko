name: Merge queue

on:
    push:
        branches: [main]
    schedule:
        - cron: '*/5 * * * *'
    workflow_dispatch:

permissions:
    contents: read

# A queued event may replace another pending event; the periodic run recovers it.
concurrency:
    group: ekko-merge-queue
    cancel-in-progress: false

jobs:
    reconcile:
        if: github.ref == 'refs/heads/main' && vars.EKKO_MERGE_QUEUE_ENABLED == 'true'
        environment: merge-queue
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # Only trusted main code is checked out. PR code is never executed here.
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: refs/heads/main
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '24'
            - id: app-token
              uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
              with:
                  app-id: ${{ vars.MERGE_QUEUE_APP_ID }}
                  private-key: ${{ secrets.MERGE_QUEUE_PRIVATE_KEY }}
                  permission-administration: read
                  permission-actions: read
                  permission-contents: write
                  permission-pull-requests: write
                  permission-checks: read
                  permission-statuses: read
            - name: Reconcile one pull request
              run: node scripts/merge-queue/queue.mjs
              env:
                  MERGE_QUEUE_TOKEN: ${{ steps.app-token.outputs.token }}
                  MERGE_QUEUE_ALLOWED_AUTHORS: ${{ vars.MERGE_QUEUE_ALLOWED_AUTHORS }}
